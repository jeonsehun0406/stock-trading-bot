name: Trading Bot Scan

# 한국장 09:00~15:30 KST = 00:00~06:30 UTC (GitHub Actions cron은 UTC 기준).
# 평일 5분마다 두 구간으로 나눠 커버한다 (서버_무인실행_가이드.md의 crontab 예시와 동일한 방식).
# 저녁 8시(20:00 KST = 11:00 UTC) 1회 실행 — 그날 매매를 국내/해외로 나눠 요약해 카톡/텔레그램으로
# 보낸다 (trading_bot.py의 send_daily_summary가 저녁 8시 이후 하루 1번만 전송하도록 게이팅함).
# ⚠️ GitHub이 공식적으로 명시하는 한계: 부하가 높으면 예약 실행이 몇 분 밀리거나
# 드물게 건너뛸 수 있다 — "정확히 5분마다"/"정확히 20시"를 100% 보장하지 않는다.
on:
  schedule:
    - cron: "*/5 0-5 * * 1-5"
    - cron: "0-30/5 6 * * 1-5"
    - cron: "0 11 * * 1-5"
  workflow_dispatch: {}

# 이전 실행이 아직 안 끝났으면 겹쳐 실행하지 않는다 — 상태 파일을 서로 덮어쓰며 커밋하는
# 충돌을 막기 위함. cancel-in-progress를 true로 둔다: false였을 때 레이트리밋으로 한 번
# 오래 걸리면 뒤이은 5분 간격 트리거들이 계속 대기열에 쌓였다가 장 마감 몇 시간 뒤에까지
# 밀려서 실행되는 문제가 실제로 발생했다(전부 "장종료" 에러로 허비됨). 최신 스캔이 낡은
# 대기 스캔보다 훨씬 가치 있으므로 새 트리거가 오면 오래된 실행은 취소한다.
concurrency:
  group: trading-bot-scan
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install python-kis python-dotenv pandas numpy matplotlib yfinance finance-datareader requests anthropic

      - name: Write .env from GitHub Secrets
        run: |
          cat > .env << EOF
          KIS_HTS_ID=${{ secrets.KIS_HTS_ID }}
          KIS_ACCOUNT_NO=${{ secrets.KIS_ACCOUNT_NO }}
          KIS_APP_KEY=${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET=${{ secrets.KIS_APP_SECRET }}
          KIS_V_APP_KEY=${{ secrets.KIS_V_APP_KEY }}
          KIS_V_APP_SECRET=${{ secrets.KIS_V_APP_SECRET }}
          KIS_V_ACCOUNT_NO=${{ secrets.KIS_V_ACCOUNT_NO }}
          KIS_VIRTUAL=${{ secrets.KIS_VIRTUAL }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          BOT_STRATEGY=${{ secrets.BOT_STRATEGY }}
          ENABLE_US_TRADING=${{ secrets.ENABLE_US_TRADING }}
          ENABLE_CLOSING_TRADE=${{ secrets.ENABLE_CLOSING_TRADE }}
          KELLY_FRACTION=0.25
          KELLY_MAX_WEIGHT=0.25
          KELLY_MIN_WEIGHT=0.05
          EOF

      - name: Run bot (1회 스캔)
        run: python trading_bot.py

      - name: Commit updated state back to repo
        run: |
          git config user.name "stockbot-actions"
          git config user.email "actions@users.noreply.github.com"
          for f in bot_state.json logs/order_guard.json logs/kelly_history.json logs/news_cache_*.json logs/daily_summary_sent.json; do
            [ -e "$f" ] && git add -f "$f"
          done
          git diff --cached --quiet || git commit -m "chore: bot 상태 업데이트 [skip ci]"
          git pull --rebase --autostash origin main
          git push
